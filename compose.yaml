name: llm-privacy-gateway
services:
  gateway:
    build: .
    image: local-privacy-gateway:dev
    ports: ["127.0.0.1:${UI_PORT:-8010}:8000"]

    env_file: .env
    environment:
      PRIVACY_PROXY_URL: http://proxy:4000
      PRIVACY_MODEL_PATH: /app/models/gliner
    volumes: ["./models:/app/models:ro"]
    networks: [private]
    depends_on: [proxy]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proxy:
    image: local-privacy-gateway:dev
    command: ["python", "-c", "from litellm import run_server; run_server()", "--config", "/app/config/litellm.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      PRIVACY_PROXY_KEY: ${PRIVACY_PROXY_KEY}
      PRIVACY_SIGNING_KEY: ${PRIVACY_SIGNING_KEY}
      PRIVACY_PROXY_MODEL: privacy-mock
      MOCK_API_BASE: http://mock:8001/v1
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      OTEL_SDK_DISABLED: "true"
      LITELLM_TELEMETRY: "False"
    networks: [private]
    depends_on: [mock]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mock:
    image: local-privacy-gateway:dev
    command: ["python", "-m", "uvicorn", "privacy_gateway.mock_llm:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  private:
    internal: true

